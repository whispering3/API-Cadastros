version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: api_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api_fastapi
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/api_db
      SECRET_KEY: 7b0e4a9e5c6d3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
